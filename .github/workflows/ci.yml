name: Cross-Platform CI/CD Matrix

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NO_COLOR: "1"
  TERM: "dumb"
  COLUMNS: "120"

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # Ubuntu Linux x86_64
          - macos-latest       # macOS Apple Silicon (Standard GA runner)
          - windows-latest     # Windows x86_64
        python-version:
          - "3.10"             # Project minimum declared version
          - "3.11"
          - "3.12"
          - "3.13"             # Current supported stable version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Linux Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-0 libsecret-1-dev

      - name: Install Python dependencies and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine ruff mypy

      - name: Lint with Ruff
        run: |
          ruff check src tests

      - name: Type check with Mypy
        run: |
          mypy src

      - name: Run pytest test suite (Linux with D-Bus Secret Service)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            eval $(echo "" | gnome-keyring-daemon --unlock --components=secrets)
            python -c "import keyring; print(\"Active Keyring Backend:\", keyring.get_keyring())"
            pytest tests
          '

      - name: Run pytest test suite (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          pytest tests

      - name: Run platform-specific test suite (Linux with D-Bus Secret Service)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            eval $(echo "" | gnome-keyring-daemon --unlock --components=secrets)
            pytest tests/platform -v
          '

      - name: Run platform-specific test suite (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          pytest tests/platform -v

      - name: Build package distribution (sdist and wheel)
        run: |
          python -m build

      - name: Validate distribution packages with Twine
        run: |
          twine check dist/*

      - name: Fresh installation smoke test (POSIX)
        if: runner.os != 'Windows'
        run: |
          python -m venv test_env
          test_env/bin/pip install dist/*.whl
          test_env/bin/brahmastra --version
          test_env/bin/brahmastra doctor

      - name: Fresh installation smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv test_env
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          test_env\Scripts\pip.exe install $wheel
          test_env\Scripts\brahmastra.exe --version
          test_env\Scripts\brahmastra.exe doctor

  # Strictly enforced ARM64 Linux runner job
  linux-arm64-check:
    name: Linux ARM64 Verification
    runs-on: ubuntu-24.04-arm
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-0 libsecret-1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine ruff mypy

      - name: Full Verification
        run: |
          ruff check src tests
          mypy src
          dbus-run-session -- bash -c '
            eval $(echo "" | gnome-keyring-daemon --unlock --components=secrets)
            pytest tests
          '
          python -m build
          twine check dist/*
